name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备带图标的 Electron 分发目录
        run: node scripts/prepare-dist.mjs

      - name: 类型检查 + 构建前端
        run: npm run build:web

      - name: 打包
        run: npx electron-builder --win nsis portable zip --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: whaletodo-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
