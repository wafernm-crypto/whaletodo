name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 准备带图标的 Electron 分发目录
        run: node scripts/prepare-dist.mjs

      - name: 类型检查 + 构建前端
        run: npm run build:web

      - name: 打包
        run: npx electron-builder --win nsis portable zip --publish never

      # GitHub Release 上传时会丢掉文件名里的中文（鲸鱼待办 → 空），
      # 所以统一改成 ASCII 文件名，安装后的应用名仍然是「鲸鱼待办」。
      - name: 规范产物文件名
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.zip' -and $_.Name -notlike '*__uninstaller*'
          } | ForEach-Object {
            $new = if ($_.Name -like '*Setup*') {
              "WhaleTodo-$version-Setup.exe"
            } elseif ($_.Extension -eq '.zip') {
              "WhaleTodo-$version-win-x64.zip"
            } else {
              "WhaleTodo-$version-Portable.exe"
            }
            if ($_.Name -ne $new) {
              Move-Item $_.FullName (Join-Path $_.DirectoryName $new) -Force
            }
          }
          Get-ChildItem release -File -Include *.exe, *.zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: whaletodo-windows
          path: |
            release/WhaleTodo-*.exe
            release/WhaleTodo-*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WhaleTodo-*.exe
            release/WhaleTodo-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
